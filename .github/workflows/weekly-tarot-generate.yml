name: 週次タロット 自動生成

on:
  schedule:
    - cron: '0 14 * * 0'  # 毎週日曜 23:00 JST (14:00 UTC)
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 今週分のタロットコンテンツを生成
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/generate_weekly_tarot.py

      - name: 変更をコミット・push
        if: steps.generate.outputs.skipped != 'true'
        run: |
          git config user.name "ASUMIRA Auto"
          git config user.email "auto@asumira.jp"
          git add 占い/weekly/index.html
          git commit -m "週次タロット 自動更新: ${{ steps.generate.outputs.target_date }}週"
          git push origin main
